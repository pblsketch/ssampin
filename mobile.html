<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0e17" />
    <title>쌤핀 모바일</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-sp-bg text-sp-text">
    <div id="root"></div>
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" defer></script>
    <script type="module" src="/src/mobile/main.tsx"></script>

    <!-- Service Worker 자동 새로고침
         vite-plugin-pwa 의 autoUpdate 모드는 새 SW 가 활성화되어도(skipWaiting+clientsClaim)
         현재 페이지를 자동 새로고침하지 않는다. 이로 인해 사용자가 PWA 를 재오픈해도 옛 번들이
         계속 보이는 문제가 생긴다(2회 재오픈 필요). controllerchange 이벤트를 듣고 한 번만
         reload 해서 새 코드가 즉시 반영되게 한다. -->
    <script>
      if ('serviceWorker' in navigator) {
        var __ssampinReloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (__ssampinReloading) return;
          __ssampinReloading = true;
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
