<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0e17" />
    <!-- m.ssampin.com 은 로그인해서 쓰는 앱 화면이다. 크롤러가 받아 가는 것은 본문이 없는
         껍데기뿐이라, 색인되면 브랜드 검색에 빈 페이지가 걸린다. 홍보용 본문은 랜딩(www)이 맡는다. -->
    <meta name="robots" content="noindex, follow" />
    <title>쌤핀 모바일</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
    <!-- Pretendard Variable: 데스크톱과 동일 폰트 인상 유지 (font-sp-medium 등 가변 weight 축 사용)
         비동기 로드 (media="print" 트릭) — 1차 렌더는 Noto Sans KR로, 도착 후 자동 교체 -->
    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
          media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    </noscript>
  </head>
  <body class="bg-sp-bg text-sp-text">
    <div id="root"></div>
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" defer></script>
    <script type="module" src="/src/mobile/main.tsx"></script>

    <!-- Service Worker 자동 새로고침
         vite-plugin-pwa 의 autoUpdate 모드는 새 SW 가 활성화되어도(skipWaiting+clientsClaim)
         현재 페이지를 자동 새로고침하지 않는다. 이로 인해 사용자가 PWA 를 재오픈해도 옛 번들이
         계속 보이는 문제가 생긴다(2회 재오픈 필요). controllerchange 이벤트를 듣고 한 번만
         reload 해서 새 코드가 즉시 반영되게 한다. -->
    <script>
      if ('serviceWorker' in navigator) {
        var __ssampinReloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (__ssampinReloading) return;
          __ssampinReloading = true;
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
