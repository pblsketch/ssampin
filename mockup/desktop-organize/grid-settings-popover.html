<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>바탕화면 정리 — 그리드 설정 팝오버</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'sp-bg':        '#0a0e17',
            'sp-surface':   '#131a2b',
            'sp-card':      '#1a2332',
            'sp-border':    '#2a3548',
            'sp-accent':    '#3b82f6',
            'sp-highlight': '#f59e0b',
            'sp-text':      '#e2e8f0',
            'sp-muted':     '#94a3b8',
          },
          fontFamily: {
            sans: ['"Noto Sans KR"', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    body {
      background-color: #1e2a3a;
      background-image:
        radial-gradient(ellipse at 20% 80%, rgba(59,130,246,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.06) 0%, transparent 45%);
      font-family: 'Noto Sans KR', sans-serif;
    }

    /* 배경 위젯 카드 (블러 처리) */
    .organize-box-bg {
      background-color: rgba(26, 35, 50, 0.42);
      border: 1px solid rgba(42, 53, 72, 0.9);
    }

    /* 팝오버 */
    .popover {
      background: #1a2332;
      border: 1px solid rgba(42, 53, 72, 0.95);
      border-radius: 12px;
      box-shadow:
        0 20px 40px rgba(0,0,0,0.5),
        0 4px 12px rgba(0,0,0,0.3),
        0 0 0 1px rgba(59,130,246,0.1);
      width: 280px;
    }

    /* 팝오버 배경 어두운 backdrop */
    .popover-backdrop {
      background: rgba(10, 14, 23, 0.45);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      border-radius: inherit;
    }

    /* 프리셋 버튼 */
    .preset-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 6px;
      border-radius: 8px;
      border: 1px solid rgba(42,53,72,0.8);
      background: rgba(26,35,50,0.6);
      cursor: pointer;
      transition: border-color 120ms, background 120ms;
      flex: 1;
      user-select: none;
    }
    .preset-btn:hover {
      border-color: rgba(59,130,246,0.5);
      background: rgba(59,130,246,0.08);
    }
    .preset-btn.active {
      border-color: #3b82f6;
      background: rgba(59,130,246,0.12);
      box-shadow: 0 0 0 2px rgba(59,130,246,0.15);
    }
    .preset-label {
      font-size: 9.5px;
      color: #94a3b8;
      font-weight: 500;
      text-align: center;
      line-height: 1.2;
    }
    .preset-btn.active .preset-label {
      color: #93c5fd;
    }

    /* 미니 그리드 일러스트 */
    .mini-grid {
      display: grid;
      gap: 2px;
    }
    .mini-cell {
      background: #2a3548;
      border-radius: 2px;
    }
    .preset-btn.active .mini-cell {
      background: rgba(59,130,246,0.45);
    }
    .preset-btn:hover:not(.active) .mini-cell {
      background: rgba(59,130,246,0.2);
    }

    /* 구분선 */
    .divider {
      height: 1px;
      background: rgba(42,53,72,0.7);
      margin: 0 -1px;
    }

    /* 숫자 입력 */
    .num-input {
      background: rgba(10,14,23,0.6);
      border: 1px solid rgba(42,53,72,0.9);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 13px;
      font-weight: 500;
      color: #e2e8f0;
      width: 58px;
      text-align: center;
      outline: none;
      font-family: 'Noto Sans KR', sans-serif;
      transition: border-color 120ms;
      -moz-appearance: textfield;
    }
    .num-input:focus {
      border-color: rgba(59,130,246,0.7);
      box-shadow: 0 0 0 2px rgba(59,130,246,0.12);
    }
    .num-input::-webkit-inner-spin-button,
    .num-input::-webkit-outer-spin-button {
      opacity: 0.4;
    }

    /* 버튼 */
    .btn-cancel {
      flex: 1;
      padding: 7px 12px;
      border-radius: 7px;
      border: 1px solid rgba(42,53,72,0.9);
      background: transparent;
      font-size: 12px;
      font-weight: 500;
      color: #94a3b8;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
      transition: background 120ms, color 120ms;
    }
    .btn-cancel:hover {
      background: rgba(255,255,255,0.06);
      color: #e2e8f0;
    }
    .btn-apply {
      flex: 1.4;
      padding: 7px 12px;
      border-radius: 7px;
      border: none;
      background: #3b82f6;
      font-size: 12px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
      transition: background 120ms;
    }
    .btn-apply:hover { background: #2563eb; }

    /* 경고 박스 */
    .warn-box {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 7px;
      padding: 8px 10px;
    }

    /* 미리보기 텍스트 */
    .preview-tag {
      background: rgba(59,130,246,0.12);
      border: 1px solid rgba(59,130,246,0.25);
      border-radius: 5px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 500;
      color: #93c5fd;
    }

    /* 가짜 OS 아이콘 */
    .desktop-icon {
      display: flex; flex-direction: column;
      align-items: center; gap: 3px;
      width: 64px; cursor: default; user-select: none;
    }
    .icon-label {
      font-size: 10px; color: #e2e8f0; text-align: center;
      line-height: 1.3; text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      word-break: break-all;
    }
    .icon-emoji { font-size: 26px; line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

    .icon-btn {
      display: flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 6px;
      color: #94a3b8;
      cursor: pointer; border: none;
      font-size: 15px;
      background: rgba(59,130,246,0.18);
      color: #60a5fa;
    }

    /* 삼각형 화살표 */
    .popover-arrow {
      position: absolute;
      top: -7px; right: 28px;
      width: 14px; height: 7px;
      overflow: hidden;
    }
    .popover-arrow::after {
      content: '';
      position: absolute;
      top: 3px; left: 0;
      width: 14px; height: 14px;
      background: #1a2332;
      border: 1px solid rgba(42,53,72,0.95);
      transform: rotate(45deg);
      border-radius: 2px;
    }
  </style>
</head>
<body class="flex items-center justify-center" style="min-height:800px;">

  <!-- 1280×800 시뮬레이션 -->
  <div class="relative" style="width:1280px; height:800px; overflow:hidden; background-color:#1e2a3a;">

    <!-- 배경 그라데이션 -->
    <div class="absolute inset-0 pointer-events-none"
         style="background: radial-gradient(ellipse at 15% 85%, rgba(30,64,175,0.18) 0%, transparent 55%),
                            radial-gradient(ellipse at 85% 15%, rgba(109,40,217,0.10) 0%, transparent 50%);"></div>

    <!-- 팝오버 오픈 시 배경 어두움 오버레이 -->
    <div class="absolute inset-0 pointer-events-none"
         style="background: rgba(0,0,0,0.3); backdrop-filter: blur(1px); -webkit-backdrop-filter: blur(1px);"></div>

    <!-- 위젯 카드 (배경, 블러 약화) -->
    <div class="absolute"
         style="top:80px; left:190px; width:900px; height:580px;
                background: rgba(19,26,43,0.75);
                border: 1px solid rgba(42,53,72,0.5);
                border-radius: 1rem;
                filter: blur(1.5px);
                display:flex; flex-direction:column; overflow:hidden; opacity:0.7;">
      <!-- 카드 헤더 (블러 배경) -->
      <div style="padding:10px 16px; border-bottom:1px solid rgba(42,53,72,0.5); display:flex; align-items:center; justify-content:space-between;">
        <span style="font-size:13px; font-weight:700; color:#e2e8f0;">📌 바탕화면 정리</span>
        <div style="display:flex; gap:4px;">
          <div style="width:28px;height:28px; border-radius:6px; background:rgba(59,130,246,0.18);"></div>
          <div style="width:28px;height:28px; border-radius:6px; background:rgba(255,255,255,0.06);"></div>
        </div>
      </div>
      <!-- 그리드 (단순화된 배경) -->
      <div style="flex:1; padding:12px; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr); gap:10px;">
        <div class="organize-box-bg rounded-xl"></div>
        <div class="organize-box-bg rounded-xl"></div>
        <div class="organize-box-bg rounded-xl"></div>
        <div class="organize-box-bg rounded-xl"></div>
        <div class="organize-box-bg rounded-xl"></div>
        <div class="organize-box-bg rounded-xl"></div>
      </div>
    </div>

    <!-- 팝오버 위치: 헤더 ⚙️ 버튼 바로 아래 우측 정렬 -->
    <div class="absolute"
         style="top:128px; right: calc(1280px - 190px - 900px + 8px); z-index:50;">

      <!-- 화살표 -->
      <div class="popover-arrow"></div>

      <!-- 팝오버 본체 -->
      <div class="popover" style="position:relative;">

        <!-- 팝오버 콘텐츠 -->
        <div style="padding: 14px 14px 0;">

          <!-- 제목 -->
          <div style="font-size:12px; font-weight:700; color:#e2e8f0; margin-bottom:12px; letter-spacing:0.01em;">
            그리드 구성
          </div>

          <!-- 프리셋 3개 -->
          <div style="display:flex; gap:6px; margin-bottom:12px;">

            <!-- 프리셋 1: 1×3 가로형 -->
            <button class="preset-btn" onclick="selectPreset(this, 1, 3)">
              <div class="mini-grid" style="grid-template-columns:repeat(3,1fr); width:48px; height:20px;">
                <div class="mini-cell"></div>
                <div class="mini-cell"></div>
                <div class="mini-cell"></div>
              </div>
              <span class="preset-label">1×3<br/>가로형</span>
            </button>

            <!-- 프리셋 2: 3×1 세로형 -->
            <button class="preset-btn" onclick="selectPreset(this, 3, 1)">
              <div class="mini-grid" style="grid-template-columns:1fr; grid-template-rows:repeat(3,1fr); width:20px; height:48px;">
                <div class="mini-cell"></div>
                <div class="mini-cell"></div>
                <div class="mini-cell"></div>
              </div>
              <span class="preset-label">3×1<br/>세로형</span>
            </button>

            <!-- 프리셋 3: 2×2 정사각 (현재 선택) -->
            <button class="preset-btn active" onclick="selectPreset(this, 2, 2)">
              <div class="mini-grid" style="grid-template-columns:repeat(2,1fr); width:38px; height:38px;">
                <div class="mini-cell"></div>
                <div class="mini-cell"></div>
                <div class="mini-cell"></div>
                <div class="mini-cell"></div>
              </div>
              <span class="preset-label">2×2<br/>정사각</span>
            </button>

          </div>

          <!-- 구분선 -->
          <div class="divider" style="margin-bottom:12px;"></div>

          <!-- 직접 설정 -->
          <div style="margin-bottom:10px;">
            <div style="font-size:10.5px; font-weight:500; color:#94a3b8; margin-bottom:8px; letter-spacing:0.02em;">
              직접 설정
            </div>

            <div style="display:flex; align-items:center; gap:8px;">
              <!-- 가로 입력 -->
              <div style="display:flex; flex-direction:column; align-items:center; gap:3px;">
                <span style="font-size:9.5px; color:#94a3b8;">가로</span>
                <input class="num-input" id="cols-input" type="number" min="1" max="6" value="3"
                       oninput="updatePreview()" />
              </div>

              <!-- 곱셈 기호 -->
              <span style="font-size:14px; color:#475569; margin-top:12px;">×</span>

              <!-- 세로 입력 -->
              <div style="display:flex; flex-direction:column; align-items:center; gap:3px;">
                <span style="font-size:9.5px; color:#94a3b8;">세로</span>
                <input class="num-input" id="rows-input" type="number" min="1" max="6" value="2"
                       oninput="updatePreview()" />
              </div>

              <!-- 미리보기 -->
              <div style="margin-top:12px; display:flex; flex-direction:column; gap:3px; align-items:flex-start;">
                <div id="preview-tag" class="preview-tag">→ 6칸 생성</div>
              </div>
            </div>
          </div>

          <!-- 경고 박스 (그리드 축소 시 데이터 손실 경고) -->
          <div class="warn-box" style="margin-bottom:12px;" id="warn-box">
            <div style="display:flex; align-items:flex-start; gap:6px;">
              <span style="font-size:13px; line-height:1; margin-top:1px;">⚠️</span>
              <div>
                <div style="font-size:10.5px; font-weight:700; color:#fca5a5; margin-bottom:3px;">
                  박스 축소 경고
                </div>
                <div style="font-size:10px; color:rgba(252,165,165,0.8); line-height:1.5;">
                  박스 5, 6의 제목
                  <span style="font-weight:700; color:#fca5a5;">'내일 회의', '완료'</span>가<br/>
                  사라집니다. 계속하려면 적용을 누르세요.
                </div>
              </div>
            </div>
          </div>

        </div>

        <!-- 구분선 + 버튼 -->
        <div style="padding:10px 14px 12px;">
          <div class="divider" style="margin-bottom:10px;"></div>
          <div style="display:flex; gap:7px;">
            <button class="btn-cancel">취소</button>
            <button class="btn-apply">적용</button>
          </div>
        </div>

      </div>
      <!-- /팝오버 -->

    </div>
    <!-- /팝오버 위치 -->

    <!-- 활성 ⚙️ 버튼 강조 표시 -->
    <div class="absolute"
         style="top:88px; right: calc(1280px - 190px - 900px + 12px); z-index:51;
                width:28px; height:28px; border-radius:6px;
                background:rgba(59,130,246,0.22); border:1px solid rgba(59,130,246,0.5);
                display:flex; align-items:center; justify-content:center; font-size:15px; color:#60a5fa;">
      ⚙️
    </div>

    <!-- 바탕화면 산재 아이콘 -->
    <div class="absolute" style="top:30px; left:20px; opacity:0.5;">
      <div class="desktop-icon"><span class="icon-emoji">🖥️</span><span class="icon-label">내 PC</span></div>
    </div>
    <div class="absolute" style="top:120px; left:20px; opacity:0.5;">
      <div class="desktop-icon"><span class="icon-emoji">🗑️</span><span class="icon-label">휴지통</span></div>
    </div>

    <!-- 시스템 트레이 -->
    <div class="absolute bottom-0 left-0 right-0 flex items-center justify-between px-4"
         style="height:36px; background:rgba(10,14,23,0.85); border-top:1px solid rgba(42,53,72,0.5);">
      <div style="font-size:11px; color:#94a3b8;">📌 쌤핀 v2.1.0</div>
      <div style="font-size:11px; color:#94a3b8;">오전 09:15 &nbsp; 2026-05-07</div>
    </div>

    <!-- 설명 레이블 -->
    <div class="absolute"
         style="bottom:42px; left:190px; font-size:10px; color:rgba(148,163,184,0.5);">
      그리드 설정 팝오버 — ⚙️ 버튼 클릭 시 우측 하단으로 펼쳐짐. 경고 영역은 그리드 축소(4칸→2×2)시 노출.
    </div>

  </div>
  <!-- /전체 시뮬레이션 -->

  <script>
    function updatePreview() {
      const cols = parseInt(document.getElementById('cols-input').value) || 1;
      const rows = parseInt(document.getElementById('rows-input').value) || 1;
      const total = cols * rows;
      const tag = document.getElementById('preview-tag');

      if (total > 12) {
        tag.textContent = '최대 12칸 초과';
        tag.style.background = 'rgba(239,68,68,0.1)';
        tag.style.borderColor = 'rgba(239,68,68,0.3)';
        tag.style.color = '#fca5a5';
      } else {
        tag.textContent = `→ ${total}칸 생성`;
        tag.style.background = 'rgba(59,130,246,0.12)';
        tag.style.borderColor = 'rgba(59,130,246,0.25)';
        tag.style.color = '#93c5fd';
      }
    }

    function selectPreset(btn, cols, rows) {
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('cols-input').value = cols;
      document.getElementById('rows-input').value = rows;
      updatePreview();
    }
  </script>
</body>
</html>
