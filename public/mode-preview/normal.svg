<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" aria-hidden="true">
  <!-- 바탕화면 + 아이콘 -->
  <rect x="0" y="0" width="120" height="80" rx="6" fill="currentColor" opacity="0.06"/>
  <rect x="6" y="6" width="10" height="10" rx="2" fill="currentColor" opacity="0.35"/>
  <rect x="6" y="20" width="10" height="10" rx="2" fill="currentColor" opacity="0.35"/>
  <rect x="6" y="34" width="10" height="10" rx="2" fill="currentColor" opacity="0.35"/>
  <!-- 위젯 창 (다른 창에 가려질 수 있음 — 뒤에 위치) -->
  <rect x="22" y="14" width="60" height="48" rx="4" fill="currentColor" opacity="0.18" stroke="currentColor" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="22" y1="22" x2="82" y2="22" stroke="currentColor" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="27" cy="18" r="1.5" fill="currentColor" opacity="0.5"/>
  <!-- 위에 다른 창이 덮음 -->
  <rect x="48" y="28" width="60" height="44" rx="4" fill="#ffffff" fill-opacity="0.92" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"/>
  <line x1="48" y1="36" x2="108" y2="36" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"/>
  <circle cx="53" cy="32" r="1.5" fill="currentColor" opacity="0.6"/>
  <line x1="54" y1="44" x2="100" y2="44" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="54" y1="50" x2="92" y2="50" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="54" y1="56" x2="96" y2="56" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/>
</svg>
