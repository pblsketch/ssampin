<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" aria-hidden="true">
  <!-- 바탕화면 + 아이콘 -->
  <rect x="0" y="0" width="120" height="80" rx="6" fill="currentColor" opacity="0.06"/>
  <rect x="6" y="6" width="10" height="10" rx="2" fill="currentColor" opacity="0.35"/>
  <rect x="6" y="20" width="10" height="10" rx="2" fill="currentColor" opacity="0.35"/>
  <rect x="6" y="34" width="10" height="10" rx="2" fill="currentColor" opacity="0.35"/>
  <!-- 다른 창 (아래에 위치) -->
  <rect x="22" y="22" width="60" height="44" rx="4" fill="currentColor" opacity="0.14" stroke="currentColor" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="22" y1="30" x2="82" y2="30" stroke="currentColor" stroke-opacity="0.35" stroke-width="1"/>
  <!-- 위젯 창 (항상 위 — 위에 위치, 핀 표시) -->
  <rect x="42" y="12" width="60" height="48" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="42" y1="20" x2="102" y2="20" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="1"/>
  <!-- 압정 아이콘 (항상 위 상징) -->
  <circle cx="96" cy="16" r="2.5" fill="#3b82f6"/>
  <line x1="96" y1="18.5" x2="96" y2="23" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="54" y1="30" x2="100" y2="30" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="54" y1="36" x2="92" y2="36" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="54" y1="42" x2="96" y2="42" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="54" y1="48" x2="88" y2="48" stroke="currentColor" stroke-opacity="0.3" stroke-width="1"/>
</svg>
