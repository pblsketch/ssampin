name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # codegen(gen-bridge-contract)은 LF로 생성물을 렌더하고 check-contract-sync가
      # 바이트 단위(!==)로 비교한다. Windows 러너 기본 autocrlf=true면 체크아웃이 CRLF로
      # 바뀌어 postbuild contract-sync 게이트가 오탐 실패한다(mac/로컬은 LF라 통과).
      # 체크아웃 전에 LF 유지로 고정해 mac 빌드와 동일 조건을 만든다.
      - name: Configure git for LF checkout (match codegen line endings)
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript type check
        run: npm run typecheck

      - name: Build Windows installer
        run: npm run build && npx electron-builder --win --publish never
        shell: bash
        env:
          VITE_DEV_SERVER_URL: ''
          # macOS 빌드와 동일 — Vite build 가드가 client_id/secret 빈값 시 throw.
          # OAuth 정상 동작을 위해 secrets 주입을 명시.
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}

      - name: Verify build output
        shell: bash
        run: |
          ls -lh release/
          if ! ls release/*.exe 1>/dev/null 2>&1; then
            echo "::error::No .exe files found in release/"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ssampin-windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        if: success()
        shell: bash
        run: |
          echo "## Windows Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files" >> $GITHUB_STEP_SUMMARY
          for f in release/*.exe; do
            echo "- \`$(basename $f)\` ($(du -h "$f" | cut -f1))" >> $GITHUB_STEP_SUMMARY
          done
