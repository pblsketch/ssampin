name: Build macOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS DMG
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript type check
        run: npm run typecheck

      - name: Build macOS DMG
        run: npm run build && npx electron-builder --mac --publish never
        env:
          VITE_DEV_SERVER_URL: ''
          # v2.0.9 추가 — Vite build 가드가 client_id/secret 빈값 시 throw.
          # v2.0.8 macOS 빌드는 이 env가 없어 client_id 빈 채 .dmg 가 만들어졌고
          # 사용자 OAuth가 전체 깨졌음. 재발 방지로 secrets 주입을 명시.
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
          # Supabase 값이 없으면 SupabaseAnalyticsAdapter 가 비활성화돼 버전/다운로드
          # 집계가 전송되지 않는다(로컬 빌드는 .env 로 주입됐으나 GHA 는 .env 가 없음).
          # anon 키는 클라이언트에 실려 배포되는 공개키(RLS 로 보호)라 secrets 로 주입해도 안전.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify build output
        run: |
          ls -lh release/
          if ! ls release/*.dmg 1>/dev/null 2>&1; then
            echo "::error::No .dmg files found in release/"
            exit 1
          fi

      # 서명·아키텍처 게이트 (2026-08-24 추가)
      #
      # 왜 필요한가: v2.4.4 까지 이 워크플로는 "DMG 파일이 생겼는지"만 확인했다. 그 사이
      # electron-builder 는 인증서를 못 찾아 서명을 통째로 건너뛰고 있었고(로그에 warn 한 줄뿐,
      # 빌드는 성공), 앱 번들에 _CodeSignature 가 0개인 DMG 가 여러 버전 배포됐다.
      # macOS 는 그런 번들을 "손상된 앱"으로 취급해 [그래도 열기] 조차 내주지 않는다.
      # 같은 사고가 조용히 재발하지 않도록 봉인 유무와 통합 바이너리 여부를 빌드에서 막는다.
      - name: Verify code signature and architecture
        run: |
          set -euo pipefail
          count=0
          for APP in release/mac*/*.app; do
            echo "=== $APP"

            if [ ! -d "$APP/Contents/_CodeSignature" ]; then
              echo "::error::$APP 에 _CodeSignature 가 없습니다 — 서명이 건너뛰어졌습니다. electron-builder.yml 의 mac.identity 를 확인하세요."
              exit 1
            fi

            codesign -dvvv "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"

            # 공증(notarization)을 하지 않으므로 spctl 은 rejected 가 정상이다. 기록만 남긴다.
            spctl -a -vvv -t exec "$APP" || true

            # 칩별 빌드이므로 각 번들의 실행 파일이 해당 칩 것인지 확인한다.
            # (빌드 러너가 Apple Silicon 이라, 교차 빌드가 깨지면 x64 DMG 에 arm64 바이너리가 실린다.)
            EXE="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
            ARCHS="$(lipo -archs "$EXE")"
            echo "archs=$ARCHS"
            case "$APP" in
              *mac-arm64*)
                case "$ARCHS" in *arm64*) ;; *) echo "::error::arm64 빌드인데 실행 파일이 $ARCHS 입니다"; exit 1 ;; esac ;;
              *)
                case "$ARCHS" in *x86_64*) ;; *) echo "::error::x64 빌드인데 실행 파일이 $ARCHS 입니다"; exit 1 ;; esac ;;
            esac

            count=$((count + 1))
          done

          if [ "$count" -ne 2 ]; then
            echo "::error::앱 번들이 2개(x64·arm64)여야 하는데 ${count}개입니다"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ssampin-macos-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.blockmap
            release/latest-mac.yml
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        if: success()
        run: |
          echo "## macOS Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files" >> $GITHUB_STEP_SUMMARY
          for f in release/*.dmg; do
            echo "- \`$(basename $f)\` ($(du -h "$f" | cut -f1))" >> $GITHUB_STEP_SUMMARY
          done
