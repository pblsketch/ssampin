name: Build macOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS DMG
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript type check
        run: npm run typecheck

      - name: Build macOS DMG
        run: npm run build && npx electron-builder --mac --publish never
        env:
          VITE_DEV_SERVER_URL: ''
          # v2.0.9 추가 — Vite build 가드가 client_id/secret 빈값 시 throw.
          # v2.0.8 macOS 빌드는 이 env가 없어 client_id 빈 채 .dmg 가 만들어졌고
          # 사용자 OAuth가 전체 깨졌음. 재발 방지로 secrets 주입을 명시.
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
          # Supabase 값이 없으면 SupabaseAnalyticsAdapter 가 비활성화돼 버전/다운로드
          # 집계가 전송되지 않는다(로컬 빌드는 .env 로 주입됐으나 GHA 는 .env 가 없음).
          # anon 키는 클라이언트에 실려 배포되는 공개키(RLS 로 보호)라 secrets 로 주입해도 안전.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify build output
        run: |
          ls -lh release/
          if ! ls release/*.dmg 1>/dev/null 2>&1; then
            echo "::error::No .dmg files found in release/"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ssampin-macos-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.blockmap
            release/latest-mac.yml
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        if: success()
        run: |
          echo "## macOS Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files" >> $GITHUB_STEP_SUMMARY
          for f in release/*.dmg; do
            echo "- \`$(basename $f)\` ($(du -h "$f" | cut -f1))" >> $GITHUB_STEP_SUMMARY
          done
