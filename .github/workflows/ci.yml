name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치/PR에서 새 푸시가 오면 진행 중인 실행을 취소
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # NOTE: 현재 package-lock.json 은 Windows(개발 환경)에서 생성돼 일부 CSS 파서
      # 의존성(@csstools/css-tokenizer 등) 엔트리가 누락 → Linux 에서 `npm ci` 가
      # lockfile mismatch 로 실패한다. lockfile 을 깨끗이 재생성하기 전까지는 `npm install`
      # 로 설치한다(트리 자동 보정). lockfile 정리 후 `npm ci` 로 되돌릴 것.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # === 하드 게이트 (실패 시 CI 실패) ===

      # 1. 타입 검사 — TypeScript strict 에러 0개
      - name: Typecheck
        run: npm run typecheck

      # 2. 단위/통합 테스트 — Vitest
      - name: Test
        run: npm run test

      # 3. 회귀 grep 어서션 — scripts/regression-grep-check.mjs
      - name: Regression check
        run: npm run regression-check

      # === 비차단 (기존 부채 — 정리 전까지 경고로만 표시) ===

      # ESLint — 현재 eslint-plugin-react-hooks 미설치(rule not found) + 아키텍처 경계
      # 위반(adapters/usecases → infrastructure) 등 기존 위반 154건이 있어 non-blocking.
      # 별도 lint 정리 작업 후 continue-on-error 를 제거해 하드 게이트로 승격할 것.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true
