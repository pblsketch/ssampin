name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치/PR에서 새 푸시가 오면 진행 중인 실행을 취소
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # === 하드 게이트 (실패 시 CI 실패) ===

      # 1. 타입 검사 — TypeScript strict 에러 0개
      - name: Typecheck
        run: npm run typecheck

      # 2. 린트 — ESLint (에러 0건. no-restricted-imports / react-hooks rules-of-hooks
      #    등 기존 부채는 'warn' 으로 강등돼 경고 어노테이션으로만 표시됨 — eslint.config.js 참고)
      - name: Lint
        run: npm run lint

      # 3. 단위/통합 테스트 — Vitest
      - name: Test
        run: npm run test

      # 4. 회귀 grep 어서션 — scripts/regression-grep-check.mjs
      - name: Regression check
        run: npm run regression-check
