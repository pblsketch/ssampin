name: Update AI Chatbot Embeddings

on:
  push:
    branches: [main]
    paths:
      - 'docs/user-guide.md'
      - 'docs/troubleshoot-guide.md'
      - 'landing/src/components/FAQ.tsx'
      - 'README.md'
      - 'CHANGELOG.md'
      # ⚠️ 이 워크플로가 돌리는 embed-docs.ts 는 위 문서들만 다룬다.
      # 챗봇 Q&A(scripts/ingest-chatbot-qa.mjs)는 ADMIN_API_KEY 가 필요해 여기서 못 돌린다 —
      # 릴리즈 SOP 3단계에서 따로 실행한다. 두 경로를 혼동하면 "반영됐겠지"로 넘어간다.
  workflow_dispatch:

jobs:
  update-embeddings:
    runs-on: ubuntu-latest
    # 임베딩(약 4분) + 품질 테스트(27케이스 × 평균 6초 ≒ 3분)를 합치면 5분으로는 모자란다.
    # 2026-08-26 실측: 임베딩은 끝났는데 품질 테스트 도중 5분 제한에 걸려 취소됐다.
    # 취소는 "실패"로 남지만 임베딩 자체는 이미 반영된 뒤라 원인을 오해하기 쉽다.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run embedding script
        env:
          UPSTAGE_API_KEY: ${{ secrets.UPSTAGE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/embed-docs.ts --all

      - name: Run quality tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: npx tsx scripts/test-chatbot.ts
        continue-on-error: true
