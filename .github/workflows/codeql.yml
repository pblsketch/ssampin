# CodeQL 정적 분석 — security-hardening P1-3 (감사 M-11)
# 참고: docs/03-analysis/security-audit.analysis.md §8 / docs/02-design/features/security-hardening.design.md §3
#
# JS/TS 코드베이스라 빌드 단계가 필요 없으므로 build-mode: none.
# GitHub 표준 "CodeQL Advanced" 템플릿 기반.
name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 매주 월요일 06:17 UTC (= KST 15:17)
    - cron: "17 6 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
