publish:
  provider: github
appId: com.ssampin.app
productName: 쌤핀
directories:
  buildResources: build
  output: release
extraResources:
  - from: 'build/icon.ico'
    to: 'icon.ico'
  # AI 브릿지 동봉 서버(self-contained 번들). 사용자 PC에 Node 미설치여도 쌤핀 실행파일을
  # ELECTRON_RUN_AS_NODE 로 노드 삼아 띄운다(설정 > AI 연결). 재생성: electron/ai-bridge/README.md 참조.
  - from: 'electron/ai-bridge'
    to: 'ai-bridge'
files:
  - from: '.'
    to: '.'
    filter:
      - 'package.json'
      - 'dist/**/*'
      - 'dist-electron/**/*'
      - 'dist-student/**/*'
      - 'node_modules/**/*'
      # Phase 0 spike isolation: prototype/realtime-tool-spike/는 G001 산출물이며 main 빌드에서 격리한다.
      # Plan D8 + G002 A.7 결정 (builderFiles.meta.test가 이 라인 부재 시 fail).
      - '!prototype/**'
      # 마크다운 변환기(kordoc) 수식 OCR용 optional 의존성은 미사용 — 설치파일에서 제외해 용량을 줄인다.
      # parse()는 이들이 없어도 정상 동작한다(경고만 남김).
      - '!node_modules/onnxruntime-node/**'
      - '!node_modules/onnxruntime-common/**'
      - '!node_modules/@huggingface/**'
      - '!node_modules/@hyzyla/**'
      # adm-zip: onnxruntime-node 전용 전이 의존성. 위에서 onnxruntime 을 뺐으므로 도달 불가 코드.
      - '!node_modules/adm-zip/**'
      # sharp(+@img 네이티브 바이너리 20MB): 앱 런타임 미사용. 이미지 처리는 Electron nativeImage 로 한다
      # (electron/main.ts §이미지 변환 "sharp 미사용", StickerImageProcessor "sharp 없음").
      # 남은 사용처는 빌드용 아이콘 스크립트(scripts/*-icon-alpha.mjs)와 kordoc 의 optional 경로뿐이다.
      # 과거 주석은 "쌤핀이 직접 쓴다"고 했으나 실제 import 는 없다 — 되돌리기 전 grep 으로 재확인할 것.
      - '!node_modules/sharp/**'
      - '!node_modules/@img/**'
      # @napi-rs/canvas: pdfjs-dist 의 optional 의존성으로, pdf.js 가 **Node 환경에서** 캔버스에
      # 래스터라이즈할 때만 require 된다(NodeCanvasFactory._createCanvas 안의 지연 require).
      # 쌤핀의 PDF 렌더는 전부 renderer(브라우저 컨텍스트)에서 DOM 캔버스로 처리하고
      # (electron/preload.ts §"renderer 측에서 pdfjs-dist로 렌더 후 PNG 바이트 전달"),
      # main 프로세스에는 pdfjs import 가 없다. kordoc 도 pdfjs 를 require 하지 않는다.
      #
      # 게다가 이 패키지는 칩/OS 전용 바이너리(canvas-darwin-arm64, canvas-win32-x64-msvc 37MB)라
      # universal 빌드에서 x64·arm64 병합을 막는 원인이었다(@electron/universal x64ArchFiles 오류).
      # 되돌리기 전에 main 프로세스나 kordoc 이 pdfjs 로 실제 래스터라이즈를 하는지부터 grep 으로 확인할 것.
      - '!node_modules/@napi-rs/**'
      # kordoc의 MCP 서버 계열도 미사용 — kordoc은 `kordoc-mcp` 라는 별도 실행파일(dist/mcp.js)에서만
      # @modelcontextprotocol/sdk 를 쓴다. 쌤핀이 import 하는 dist/index.cjs 는 xmldom·jszip·markdown-it
      # 만 필요하다(검증: dist/index.cjs 의 외부 require 목록에 sdk 없음).
      # 이 서브트리는 express/hono 웹서버까지 끌고 오며 취약점 알림의 최대 발생원이므로 설치파일에서 제외한다.
      # 되돌릴 때는 kordoc dist/index.cjs 가 정말 sdk 를 require 하는지부터 확인할 것.
      - '!node_modules/@modelcontextprotocol/**'
      - '!node_modules/@hono/**'
      - '!node_modules/hono/**'
      - '!node_modules/express/**'
      - '!node_modules/express-rate-limit/**'
# 네이티브 모듈은 asar 내부에서 require할 수 없으므로 언팩 필요.
#
# v2.2.14~ (ADR-038): 스티커 자동 붙여넣기(Ctrl+V)의 @nut-tree-fork/nut-js 의존을 제거하고
# koffi(FFI)로 user32.dll SendInput을 직접 부르도록 바꿨다(electron/platform/win32SendKeys.ts).
# 그에 따라 libnut / bindings / file-uri-to-path 언팩 항목도 함께 삭제했다 —
# nut-js 를 되살리지 않는 한 재도입 금지(취약점 알림 7건의 발생원이었다).
asarUnpack:
  # koffi: 바탕화면 아이콘 아래 모드(native-desktop) FFI + 스티커 Ctrl+V 송신.
  # Win32 전용이지만 packaging은 모든 OS 빌드에 포함되며, win32 패키지에서만 require된다.
  # .node 바이너리는 asar 외부에서 dlopen 가능해야 함 (Phase 4-1~).
  - '**/node_modules/koffi/**'
  # 보험 — 어떤 경로에 있든 네이티브 바이너리는 asar 밖으로.
  - '**/*.node'
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  fileAssociations:
    - ext: ssampin
      name: SsamPin 일정 파일
      description: 쌤핀 일정 공유 파일
      role: Editor
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 쌤핀
  artifactName: ssampin-Setup.${ext}
  include: build/installer.nsh
mac:
  target:
    - target: dmg
      # universal — 인텔/애플칩 통합 단일 파일(2026-08-24). 칩에 맞지 않는 DMG 를 받아
      # "이 버전의 macOS에서 작동하는지 확인하려면 개발자에게 문의하십시오" 오류를 보던 사고를 원천 차단한다.
      # 대가는 용량(arch 별 약 330MB → 통합 600MB대). 되돌릴 때는 landing/src/config.ts 의 다운로드 URL,
      # electron/main.ts 의 update:download, .github/workflows/build-macos.yml 검증 단계도 함께 되돌릴 것.
      arch:
        - universal
  # mac 전용 제외 — cloudflared 실행 바이너리(터널 기능).
  #
  # cloudflared npm 패키지는 postinstall 로 "빌드 머신의 칩에 맞는" 바이너리를 내려받아
  # node_modules/cloudflared/bin/ 에 둔다. 맥 빌드 러너가 Apple Silicon 이라 arm64 바이너리만
  # 들어오고, 그게 x64 슬라이스에도 그대로 복사돼 universal 병합을 막는다
  # (@electron/universal: "same in both x64 and arm64 builds ... x64ArchFiles").
  # 억지로 통과시키면 Intel Mac 에 arm64 바이너리가 실려 터널이 조용히 깨진다.
  #
  # 애초에 쌤핀은 이 바이너리를 첫 사용 시 userData 로 직접 내려받는다
  # (electron/ipc/tunnel.ts installTunnel(): "첫 사용 시, ~40MB 다운로드", userData 경로 우선).
  # 동봉본은 이전 버전 호환 fallback 일 뿐이므로 mac 에서는 빼고 런타임 다운로드에 맡긴다.
  # Windows 는 현행 유지(동봉) — 동작 변화 없음.
  #
  # koffi(FFI)도 같은 이유로 mac 에서 뺀다. koffi 는 모든 플랫폼용 프리빌드
  # (build/koffi/darwin_arm64, win32_x64 …)를 통째로 담고 있어 x64·arm64 슬라이스에
  # 동일 파일로 들어가 병합을 막는다. 그리고 쌤핀에서 koffi 는 Win32 전용 경로에서만 쓴다:
  #   - desktopWidgetManager.ts: 비Win32면 아예 no-op manager 반환("절대 throw 하지 않는다")
  #   - win32SendKeys.ts: require('koffi') 가 함수 안 try/catch — 실패 시 autoPasted=false 로 graceful
  # 따라서 mac 패키지에 없어도 동작에 영향이 없다.
  files:
    - '!node_modules/cloudflared/bin/**'
    - '!node_modules/koffi/**'
  icon: build/icon.png
  category: public.app-category.education
  minimumSystemVersion: '12.0.0'
  # identity: '-' — Apple Developer ID(연 $99) 없이 쓰는 무료 임시 서명(ad-hoc).
  #
  # 이 줄이 없으면 electron-builder 는 인증서를 못 찾고 서명을 통째로 건너뛴다
  # (app-builder-lib/out/macPackager.js 의 sign(): identity 가 없으면 return false).
  # 그래서 v2.4.4 까지의 DMG 는 앱 번들에 _CodeSignature/CodeResources 가 0개였고,
  # macOS 는 이를 "미확인 개발자"가 아니라 "손상된 앱"으로 취급했다
  # → [그래도 열기] 가 뜨지 않고 터미널 xattr 명령을 쳐야만 열리는 상태였다.
  #
  # '-' 를 주면 MacTargetHelper.findSigningIdentity() 가 ad-hoc Identity 를 만들어 번들 전체를 봉인한다.
  # 공증(notarization)은 여전히 없으므로 보안 경고 자체는 뜨지만, 막다른 "손상됨" 대신
  # [그래도 열기] 로 통과할 수 있는 정상 경로가 된다.
  identity: '-'
  # ad-hoc 서명 + hardenedRuntime 조합은 라이브러리 검증에 걸려 앱이 아예 실행되지 않을 수 있다
  # (electron-builder 가 빌드 중 직접 경고한다). 공증을 하지 않는 한 hardenedRuntime 은 이득이 없으므로 끈다.
  # Developer ID 를 도입해 공증까지 하게 되면 true 로 되돌리고 entitlements 를 다시 검토할 것.
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  fileAssociations:
    - ext: ssampin
      name: SsamPin 일정 파일
      role: Editor
  gatekeeperAssess: false
  artifactName: ssampin-${arch}.${ext}
dmg:
  format: UDZO
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
