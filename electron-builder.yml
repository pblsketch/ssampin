publish:
  provider: github
appId: com.ssampin.app
productName: 쌤핀
directories:
  buildResources: build
  output: release
extraResources:
  - from: 'build/icon.ico'
    to: 'icon.ico'
files:
  - from: '.'
    to: '.'
    filter:
      - 'package.json'
      - 'dist/**/*'
      - 'dist-electron/**/*'
      - 'dist-student/**/*'
      - 'node_modules/**/*'
      # Phase 0 spike isolation: prototype/realtime-tool-spike/는 G001 산출물이며 main 빌드에서 격리한다.
      # Plan D8 + G002 A.7 결정 (builderFiles.meta.test가 이 라인 부재 시 fail).
      - '!prototype/**'
      # 마크다운 변환기(kordoc) 수식 OCR용 optional 의존성은 미사용 — 설치파일에서 제외해 용량을 줄인다.
      # parse()는 이들이 없어도 정상 동작한다(경고만 남김). sharp 는 쌤핀이 직접 쓰므로 제외하지 않는다.
      - '!node_modules/onnxruntime-node/**'
      - '!node_modules/onnxruntime-common/**'
      - '!node_modules/@huggingface/**'
      - '!node_modules/@hyzyla/**'
# 네이티브 모듈은 asar 내부에서 require할 수 없으므로 언팩 필요.
# @nut-tree-fork/nut-js (스티커 자동 붙여넣기용) → libnut-{win32,darwin,linux} 의
# .node 바이너리가 OS dlopen으로 로드되어야 한다. 미언팩 시 win32에서
# `Cannot find module ...libnut.node` 런타임 오류 → 자동 Ctrl+V 실패.
#
# v2.0.x 핫픽스: `**/node_modules/@nut-tree-fork/**` 단일 글롭만으로는 일부
# 환경에서 .node 바이너리가 asar 외부로 추출되지 않는 회귀가 관찰되어
# (사용자 진단 로그 → libnut.node 경로 모두 app.asar 내부에서 탐색),
# (a) nut-js 하위 패키지를 명시 + (b) bindings/file-uri-to-path 의존성도 함께
# 언팩 + (c) 보험으로 모든 `.node` 파일을 강제 언팩한다.
asarUnpack:
  - '**/node_modules/@nut-tree-fork/**'
  - '**/node_modules/@nut-tree-fork/libnut-win32/**'
  - '**/node_modules/@nut-tree-fork/libnut-darwin/**'
  - '**/node_modules/@nut-tree-fork/libnut-linux/**'
  - '**/node_modules/libnut*/**'
  - '**/node_modules/bindings/**'
  - '**/node_modules/file-uri-to-path/**'
  # koffi: 바탕화면 아이콘 아래 모드(native-desktop) FFI. Win32 전용이지만 packaging은
  # 모든 OS 빌드에 포함되며, win32 패키지에서만 require된다. .node 바이너리는 asar
  # 외부에서 dlopen 가능해야 함 (Phase 4-1~).
  - '**/node_modules/koffi/**'
  - '**/*.node'
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  fileAssociations:
    - ext: ssampin
      name: SsamPin 일정 파일
      description: 쌤핀 일정 공유 파일
      role: Editor
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 쌤핀
  artifactName: ssampin-Setup.${ext}
  include: build/installer.nsh
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.png
  category: public.app-category.education
  minimumSystemVersion: '12.0.0'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  fileAssociations:
    - ext: ssampin
      name: SsamPin 일정 파일
      role: Editor
  gatekeeperAssess: false
  artifactName: ssampin-${arch}.${ext}
dmg:
  format: UDZO
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
