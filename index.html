<!doctype html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>쌤핀</title>
    <!-- 폰트: 비블로킹 로드 (PC 부팅 직후 네트워크 느릴 때 대비) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
          rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
    </noscript>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
          rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    </noscript>
    <!-- Pretendard Variable: weight axis 400/510/590/680 지원 (font-sp-medium 등) -->
    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
          media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    </noscript>
    <!-- JetBrains Mono: Kbd 컴포넌트 단축키 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
          rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    </noscript>
    <!-- 스플래시 인라인 스타일 (외부 CSS 로드 전에도 적용) -->
    <style>
      body {
        margin: 0;
        background: #0a0e17;
        overflow: hidden;
      }
      #splash {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        height: 100vh;
        background: #0a0e17;
      }
      #splash .icon {
        width: 88px;
        height: 88px;
        /* 픽셀아트 마스코트가 축소 렌더링에서 흐려지지 않도록 보간 끔 */
        image-rendering: pixelated;
        animation: pulse 1.8s ease-in-out infinite;
      }
      #splash .text {
        color: #94a3b8;
        font-size: 13px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        opacity: 0.5;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.85; transform: translateY(0) scale(1); }
        50% { opacity: 1; transform: translateY(-4px) scale(1.04); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 스플래시: React 마운트 전까지 표시, 마운트 후 React가 대체 -->
      <div id="splash">
        <img class="icon" src="./floating-pin.png" alt="쌤핀이" width="88" height="88" />
        <span class="text">쌤핀</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
