# Supabase 프로젝트 설정 (IaC) — security-hardening P1-3 (감사 M-11 / §4)
#
# 지금까지 저장소에 config.toml 이 없어 Edge Function 의 verify_jwt 설정이 암묵적이었다
# (배포 시 `supabase functions deploy <name> --no-verify-jwt` 로 관리됨 — MEMORY.md 참고).
# 이 파일은 그 상태를 명시적으로 문서화한다. 비밀값(키)은 절대 포함하지 않는다.
#
# ⚠️ 아래 [functions.*] verify_jwt 값은 "현재 배포 상태 추정"이다. 모든 함수가
#    Authorization 헤더를 자체 파싱(Google access_token 검증 또는 admin_key 비교)하거나
#    완전 공개(학생 제출/공개 챗봇) 엔드포인트이므로 verify_jwt = false 로 배포된 것으로 본다.
#    실제 Supabase 대시보드의 함수 설정과 일치하는지 사용자 확인 필요.
#
# 이 외 [auth] / [db] / [api] 등은 supabase CLI 기본값에 가깝게 최소만 둔다 — 로컬 개발 시
# 실제 적용되므로 보수적으로 유지.

project_id = "ssampin"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# 로컬 메일 테스트 (실제 프로덕션 메일은 Resend 사용 — ssampin-escalate)
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[analytics]
enabled = false

# ── Edge Functions ───────────────────────────────────────────────────────────
# verify_jwt 값은 위 ⚠️ 주석 참고 (현 배포 상태 추정 — 사용자 확인 필요).

# 챗봇 지식베이스 관리 — Bearer ADMIN_API_KEY 로 자체 인증.
[functions.ssampin-embed]
verify_jwt = false

# 공개 AI 챗봇 RAG 파이프라인 — 인증 없음 + IP/세션 rate limit.
[functions.ssampin-chat]
verify_jwt = false

# 챗봇 → 개발자 에스컬레이션(이메일) — 공개 엔드포인트.
[functions.ssampin-escalate]
verify_jwt = false

# 교사 OAuth 토큰 저장 — Google access_token → userinfo 검증으로 자체 인증.
[functions.save-teacher-token]
verify_jwt = false

# 과제 생성 — Google access_token 검증으로 자체 인증.
[functions.create-assignment]
verify_jwt = false

# 과제 삭제 — body 의 adminKey 비교로 자체 인증.
[functions.delete-assignment]
verify_jwt = false

# 학생 제출 페이지용 과제 정보 조회 — 공개 엔드포인트(민감 필드 제외).
[functions.get-assignment-public]
verify_jwt = false

# 제출물 조회 — body 의 adminKey 비교로 자체 인증.
[functions.get-submissions]
verify_jwt = false

# 학생 과제 제출 — 공개 엔드포인트(학생 인증 없음 — 의도된 설계).
[functions.submit-assignment]
verify_jwt = false
